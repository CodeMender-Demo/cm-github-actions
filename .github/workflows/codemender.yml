      - name: Report
        id: report
        run: |
          REPORT_NAME="cm-report-${{ github.sha }}.json"

          # For testing output mock json
          cat << 'EOF' > "$REPORT_NAME"
          [
            {
                "finding_id": "47ba625d-e8bc-5a24-b329-20b65a584a5e",
                "session_id": "ChAzZjJhMTRjZTM0ZDVmNGU0EAgaATAqBG1haW4",
                "title": "SQL Injection in Invoice Search Query",
                "file_path": "/home/runner/work/cm-python-sample/cm-python-sample/app/routers/invoices.py",
                "severity": "CRITICAL",
                "confidence": 100,
                "analysis": "Data Flow Analysis:\n- Source: The `customer_name`, `status`, and `sort_by` HTTP GET query parameters entered via `/api/v1/invoices/search` (app/routers/invoices.py, lines 16-24).\n- Sanitization/Validation: None. No input validation, character filtering, or column allowlisting is performed.\n- Sink: Concatenated into `base_query` using Python f-strings and executed via `cursor.execute(base_query)` (app/routers/invoices.py, line 48).\n\nAn attacker can supply SQL injection payloads in `customer_name`, `status`, or `sort_by` to manipulate the query logic, extract sensitive ledger records, or execute arbitrary SQLite functions.\n\nConceptual Exploit Payload:\nGET /api/v1/invoices/search?customer_name=%27%20OR%201=1--\nAlternatively, using UNION-based exfiltration:\nGET /api/v1/invoices/search?customer_name=%27%20UNION%20SELECT%20id,%20invoice_number,%20billing_email,%20%27pwned%27,%20amount,%20currency,%20status,%20notes,%20created_at%20FROM%20invoices--",
                "snippet": "    base_query = (\n        f\"SELECT id, invoice_number, customer_name, billing_email, amount, currency, status, notes, created_at \"\n        f\"FROM invoices WHERE customer_name LIKE '%{customer_name}%'\"\n    )\n\n    if status:\n        base_query += f\" AND status = '{status}'\"\n\n    base_query += f\" ORDER BY {sort_by} DESC\"\n\n    try:\n        cursor.execute(base_query)",
                "vuln_type": "Injection - SQL Injection",
                "vuln_id": "CWE-89",
                "status": "OPEN",
                "start_line": 37,
                "end_line": 48
              },
              {
                "finding_id": "b8962ada-5acb-5e89-82cd-455162d773ee",
                "session_id": "ChAzZjJhMTRjZTM0ZDVmNGU0EAgaATAqBG1haW4",
                "title": "SQL Injection in Invoice Lookup by Identifier",
                "file_path": "/home/runner/work/cm-python-sample/cm-python-sample/app/routers/invoices.py",
                "severity": "CRITICAL",
                "confidence": 100,
                "analysis": "Data Flow Analysis:\n- Source: The `invoice_number` path parameter supplied to `GET /api/v1/invoices/lookup/{invoice_number}` (app/routers/invoices.py, line 68).\n- Sanitization/Validation: None. The raw string parameter is directly embedded into the SQL statement.\n- Sink: Interpolated directly into `query = f\"SELECT * FROM invoices WHERE invoice_number = '{invoice_number}'\"` and executed via `cursor.execute(query)` (app/routers/invoices.py, line 81).\n\nAn attacker can provide a malicious `invoice_number` payload containing SQL syntax to bypass invoice lookups or exfiltrate unauthorized records.\n\nConceptual Exploit Payload:\nGET /api/v1/invoices/lookup/'%20OR%20'1'='1",
                "snippet": "    query = f\"SELECT * FROM invoices WHERE invoice_number = '{invoice_number}'\"\n\n    try:\n        cursor.execute(query)",
                "vuln_type": "Injection - SQL Injection",
                "vuln_id": "CWE-89",
                "status": "OPEN",
                "start_line": 78,
                "end_line": 81
              }
          ]
          EOF
          # cm report -f json > "$REPORT_NAME"
          echo "findings_file_name=$REPORT_NAME" >> $GITHUB_OUTPUT

      - name: Upload Report
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.report.outputs.findings_file_name }}
          retention-days: 1
          archive: false

      - name: Output finding ids
        id: matrix
        run: |
          MATRIX_ARRAY=$(jq -c '[.[] | .finding_id]' "${{ steps.report.outputs.findings_file_name }}")
          
          # 3. Write it to GITHUB_OUTPUT
          echo "matrix_json=$MATRIX_ARRAY" >> "$GITHUB_OUTPUT"
          
              
    
  codemender-verify:
    if: ${{ inputs.verify == true }}
    runs-on: ubuntu-22.04
    needs: codemender-find
    strategy:
      max-parallel: 10 # Limits concurrent jobs to 10
      matrix:
        # Parses the JSON string output into a GitHub Actions matrix array
        finding: ${{ fromJson(needs.codemender-find.outputs.matrix_json) }}
    
    steps:
      - name: Init Job
        run: |
          # You can now access individual finding properties via matrix.finding
          echo "Processing finding: ${{ matrix.finding }}"

      - name: Download report
        uses: actions/download-artifact@v4
        with:
            path: ${{ needs.codemender-find.outputs.findings_file_name }}

      - name: Print report
        run: |
          cat ${{ needs.codemender-find.outputs.findings_file_name }}
