name: CodeMender
permissions:
    contents: read
    id-token: write

on:
  workflow_call:
    secrets:
      workload_identity_provider:
          required: true
      service_account:
          required: true
    inputs:
      verify:
        required: false
        type: boolean
        default: false
        
jobs:
  codemender-find:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.workload_identity_provider }}"
          service_account: "${{ secrets.service_account }}"
    
      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
    
      - name: Check for existing installation and install
        run: |
          if ! command -v cm &> /dev/null; then
              echo "CodeMender not found, installing..."
              echo "Downloading CodeMender CLI..."
              curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
              unzip cm-linux-amd64.zip
              chmod +x cm
              mv cm /usr/local/bin/cm
              cm init
              rm cm-linux-amd64.zip
          else
              # Command exists, now it's safe to check the version
              CM_VERSION=$(cm --version)
              echo "CodeMender already installed. Version: $CM_VERSION"
          fi

      - name: cm find
        uses: codemender-demo/cm-find@v0.1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: cm report
        run: |
          CM_JSON=${cm report -f json}
          echo "CM_FINDINGS=$CM_JSON >>$GITHUB_OUTPUT
    
  codemender-verify:
    runs-on: ubuntu-22.04
    needs: codemender-find
    steps:
      - name: Init Job
        run: |
          echo "${{ needs.codemender-find.outputs.CM_FINDINGS }}"
