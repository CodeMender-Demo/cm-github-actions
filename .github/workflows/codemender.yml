name: CodeMender
permissions:
    contents: read
    id-token: write
    packages: read

on:
  workflow_call:
    secrets:
      workload_identity_provider:
          required: true
      service_account:
          required: true
      wiz_client_id:
          required: true
      wiz_client_secret:
          required: true
    inputs:
      verify:
        required: false
        type: boolean
        default: false
        
jobs:
  codemender-find:
    runs-on: ubuntu-22.04
    outputs:
      # cm_state_filename: ${{ steps.prep_state.outputs.cm_state_filename }}
      findings_json: ${{ steps.output_findings.outputs.findings_json }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.workload_identity_provider }}"
          service_account: "${{ secrets.service_account }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender CLI..."
          curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
          unzip cm-linux-amd64.zip
          chmod +x cm
          mv cm /usr/local/bin/cm
          cm init
          rm cm-linux-amd64.zip
      
      - name: Update config.yaml with file types
        shell: python
        run: |
          import os
          import yaml
    
          config_file = os.path.expanduser('~/.codemender/config.yaml')
            
          # 1. Discover all unique file extensions, excluding .git
          extensions = set()
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for file in files:
                  _, ext = os.path.splitext(file)
                  if ext:
                      extensions.add(ext)
    
          # 2. Load existing config
          if os.path.exists(config_file):
              with open(config_file, 'r') as f:
                  config = yaml.safe_load(f) or {}
          else:
              print("Config not found")
              config = {}
    
          # Ensure the list key exists (assuming the key is 'file_types')
          list_key = 'include'
          if list_key not in config['scan']['extensions'] or config['scan']['extensions'][list_key] is None:
              config['scan']['extensions'][list_key] = []
    
          # 3. Add new extensions
          updated = False
          for ext in extensions:
            if ext not in config['scan']['extensions'][list_key]:
                  config['scan']['extensions'][list_key].append(ext)
                  updated = True
    
          # 4. Write back if changes were made
          if updated:
              with open(config_file, 'w') as f:
                  yaml.dump(config, f, default_flow_style=False)
              print(f"Updated {config_file} with new extensions.")
          else:
              print("No new extensions found.")

      - name: Find
        run: |
            cm find .

      - name: Output findings
        id: output_findings
        run: |
          cm report -f json > findings.json
          echo "findings_json=$(jq -c . findings.json)" >> "$GITHUB_OUTPUT"
          
              
    
  codemender-verify-with-wiz-output:
    if: ${{ inputs.verify == true }}
    runs-on: ubuntu-22.04
    needs: codemender-find
    strategy:
      max-parallel: 3 # Limits concurrent jobs to 3
      fail-fast: false
      matrix:
        # Parses the JSON string output into a GitHub Actions matrix array
        finding: ${{ fromJson(needs.codemender-find.outputs.findings_json) }}
    
    steps:
      - name: Init Job
        run: |
          echo "Verifying finding: ${{ matrix.finding.finding_id }}"

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.workload_identity_provider }}"
          service_account: "${{ secrets.service_account }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender CLI..."
          curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
          unzip cm-linux-amd64.zip
          chmod +x cm
          mv cm /usr/local/bin/cm
          cm init
          rm cm-linux-amd64.zip

      - name: Import State
        env:
          FINDING_JSON: ${{ toJson(matrix.finding) }}
        run: |
          echo "$FINDING_JSON" >finding.json
          cm report import -f finding.json

      - name: Verify Finding
        run: |
          finding_id=$(cm report -f json | jq -r '.[0].finding_id')
          cm verify $finding_id --bypass-warning -y

      - name: Update Summary
        run: |
          cm report $finding -f md >> $GITHUB_STEP_SUMMARY

      - name: Write verified finding to file
        run: |
          cm report -f json >codemender_finding.json
          # Verify file is written
          cat codemender_finding.json

      - name: Get Wiz Access Token
        run: |
          TOKEN=$(curl -s -f --request POST \
          --url 'https://auth.app.wiz.io/oauth/token' \
          --header 'content-type: application/x-www-form-urlencoded' \
          --data grant_type=client_credentials \
          --data client_id=${{ secrets.wiz_client_id }} \
          --data client_secret=${{ secrets.wiz_client_secret }} \
          --data audience=wiz-api | jq -r '.access_token')

          # Mask the token in logs
          echo "::add-mask::$TOKEN"
          
          # Write it to the environment file for subsequent steps
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Get Wiz Repo Graph resource ID
        run: |
          RESPONSE=$(curl -s "https://api.us100.app.wiz.io/graphql" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{ 
            "query": "query VersionControlResources($first: Int $after: String $filterBy: VersionControlResourceFilters) { versionControlResources(first: $first after: $after filterBy: $filterBy) { nodes { id platform providerID type repository { id name url } } } }", 
            "variables": { 
              "first": 5, 
              "filterBy": { 
                "search": "${{ github.repository }}", 
                "type": "REPOSITORY_BRANCH" 
              } 
            } 
          }')
          # Extract the values into shell variables (grabs the first node in the array)
          echo $RESPONSE | jq .
          RESOURCE_TYPE=$(echo "$RESPONSE" | jq -r '.data.versionControlResources.nodes[0].type')
          RESOURCE_ID=$(echo "$RESPONSE" | jq -r '.data.versionControlResources.nodes[0].id')
            
          # Verify the variables have values
          if [ "$RESOURCE_TYPE" = "null" ] || [ "$REPO_ID" = "null" ]; then
              echo "Error: Failed to extract repository details from the API response."
              RESOURCE_TYPE=""
              RESOURCE_ID=""
          fi

          echo "WIZ_RESOURCE_TYPE=$RESOURCE_TYPE" >> "$GITHUB_ENV"
          echo "WIZ_RESOURCE_ID=$RESOURCE_ID" >> "$GITHUB_ENV"

      - name: Format finding for Wiz
        shell: python
        run: |
            import json
            import os
    
            from datetime import datetime, timezone
            
            now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'
            with open("codemender_finding.json", "r") as f:
              input_finding = json.loads(f.read())
              input_finding = input_finding[0]
            
            wiz_output = {
                "query": "mutation CreatePenetrationTestFinding($input: CreatePenetrationTestFindingInput!) { createPenetrationTestFinding(input: $input) { penetrationTestFinding { id } } }",
                "variables": {
                    "input": {
                        "name": input_finding.get("title", "unknown"),
                        "severity": input_finding.get("severity", "MEDIUM"),
                        "description": input_finding.get("vuln_type", ""),
                        "resource": {
                            "graphEntity": {
                              "id": os.environ.get("WIZ_RESOURCE_ID", ""),
                              "type": os.environ.get("WIZ_RESOURCE_TYPE", "")
                            }
                        },
                        "assetName": "${{ github.repository }}",
                        "stepsToReproduce": input_finding.get("analysis", ""),
                        "weaknesses": [input_finding.get("vuln_id", "")],
                        "reporterId": "CodeMender",
                        "reportedAt": now,
                        "origin": "MANUAL"
                    }
                }
            }

            with open("wiz_finding.json", "w") as f:
                f.write(json.dumps(wiz_output, indent=2))

      - name: Test output
        run: |
          cat wiz_finding.json

      - name: Import Finding
        run: |
          curl -f "https://api.us100.app.wiz.io/graphql" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d @wiz_finding.json | jq .
