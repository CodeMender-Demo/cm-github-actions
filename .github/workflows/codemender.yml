  codemender-verify:
    if: ${{ inputs.verify == true }}
    runs-on: ubuntu-22.04
    needs: codemender-find
    strategy:
      max-parallel: 3 # Limits concurrent jobs to 3
      fail-fast: false
      matrix:
        # Parses the JSON string output into a GitHub Actions matrix array
        finding: ${{ fromJson(needs.codemender-find.outputs.findings_json) }}
    
    steps:
      - name: Init Job
        run: |
          echo "Verifying finding: ${{ matrix.finding }}"

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.workload_identity_provider }}"
          service_account: "${{ secrets.service_account }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender CLI..."
          curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
          unzip cm-linux-amd64.zip
          chmod +x cm
          mv cm /usr/local/bin/cm
          cm init
          rm cm-linux-amd64.zip

      # - name: Download State
      #   uses: actions/download-artifact@v8
      #   with:
      #       name: ${{ needs.codemender-find.outputs.cm_state_filename }}

      - name: Import State
        run: |
          echo '${{ toJson(matrix.finding) }}' >finding.json
          cm report import -f finding.json

      - name: Verify Finding
        run: |
          finding_id=$(cm report -f json) | jq.[].finding_id 
          cm verify $finding_id --bypass-warning -y

      - name: Update Summary
        run: |
          cm report $finding -f md >> $GITHUB_STEP_SUMMARY
