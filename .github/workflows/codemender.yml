name: CodeMender
permissions:
    contents: read
    id-token: write
    packages: read

on:
  workflow_call:
    secrets:
      workload_identity_provider:
          required: true
      service_account:
          required: true
    inputs:
      verify:
        required: false
        type: boolean
        default: false
        
jobs:
  codemender-find:
    runs-on: ubuntu-22.04
    outputs:
      findings_file_name: ${{ steps.report.outputs.findings_file_name }}
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
    steps:
