
name: PR Test
on:
  # Trigger manually via the GitHub Actions UI
  workflow_dispatch:

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write

    steps:
      # Checkout the TARGET repository instead of the central .github repo
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Write a file
        run: |
          cat << EOF > experi.py
          ### This is an experimental file
          print("Hello!!")
          EOF

      - name: Print Git DIff
        run: |
          echo "### STAGING FILE ###"
          echo "$(git add experi.py)"
          echo "### PRINT GIT STATUS ###"
          echo "$(git status)"
          echo "### PRINT GIT DIFF ###"
          echo "$(git diff --staged)"

      - name: Create Draft PR using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Configure the local git user as the GitHub Actions bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Create a new branch and commit your staged files
          git checkout -b auto-update-experiment
          git commit -m "Add experi.py"
          
          # 3. Push the new branch to the repository
          git push -u origin auto-update-experiment
          
          # 4. Use the official GitHub CLI to create the Draft PR
          gh pr create \
            --title "Automated Draft PR: Experimental changes" \
            --body "This PR was automatically generated by the workflow." \
            --base main \
            --draft
          
