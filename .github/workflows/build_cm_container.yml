name: Build CodeMender CLI Runner Image

on:
  workflow_dispatch

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
            context: .
            file: DockerFile
            push: true
            tags: |
                ghcr.io/codemender-demo/codemender-runner:latest
                ghcr.io/codemender-demo/codemender-runner:${{ github.sha }}
