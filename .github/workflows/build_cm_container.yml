name: Build CodeMender CLI Runner Image

on:
  push:
    paths:
      - 'docker/runner.Dockerfile' # Only build when the Dockerfile changes
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and Push
            uses: docker/build-push-action@v5
            with:
                context: .
                    file: docker/runner.Dockerfile
                    push: true
                    tags: |
                        ghcr.io/${{ github.repository_owner }}/codemender-runner:latest
                        ghcr.io/${{ github.repository_owner }}/codemender-runner:${{ github.sha }}